name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run ty check src tests

      - name: Tests
        run: uv run pytest
