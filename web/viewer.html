<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STL / PLY Viewer — printable-surfaces</title>
<style>
  :root { --bg:#12151b; --panel:rgba(20,24,32,.92); --border:#2a2f3a; --text:#e6e8ee; --muted:#9aa3b2; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #c { display:block; width:100vw; height:100vh; }
  #panel { position:fixed; top:12px; left:12px; width:300px; background:var(--panel);
    border:1px solid var(--border); border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); }
  #panel .t { font-weight:650; font-size:15px; margin-bottom:8px; }
  #panel .t small { color:var(--muted); font-weight:400; }
  #panel input[type=text] { width:100%; padding:7px 8px; border-radius:6px; border:1px solid var(--border);
    background:#0d0f14; color:var(--text); font-family:ui-monospace,monospace; font-size:12px; }
  #panel .row { display:flex; gap:6px; margin:8px 0; }
  #panel button { padding:7px 12px; border-radius:6px; border:1px solid var(--border);
    background:#1d212b; color:var(--text); cursor:pointer; font-weight:600; white-space:nowrap; }
  #panel button:hover { background:#252b37; }
  #panel label { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; cursor:pointer; }
  #stats { margin-top:8px; font-size:12px; color:var(--muted); font-family:ui-monospace,monospace; word-break:break-all; }
  #stats.err { color:#f87171; }
  .hint { margin-top:6px; font-size:11px; color:var(--muted); opacity:.7; }
  #legend { position:fixed; bottom:14px; left:12px; font-size:12px; color:var(--muted);
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 10px; line-height:1.7; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .sw.grad { width: 120px; height: 11px; border-radius: 3px;
    background: linear-gradient(to right, #dc3232 0%, #f5d228 50%, #28b45a 100%); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <div class="t">Viewer <small>· printable-surfaces</small></div>
  <input id="path" type="text" placeholder="output/lattice/….stl or .ply" spellcheck="false">
  <div class="row">
    <button id="load">Load</button>
    <label><input type="checkbox" id="color" checked> color rods / faces</label>
  </div>
  <div id="stats">—</div>
  <div class="hint">Enter a root-relative path, or drag &amp; drop an .stl / .ply file.</div>
</div>

<div id="legend">
  <div><span class="sw grad"></span> rod angle from horizontal &nbsp;<span style="color:#dc3232">0°</span> → <span style="color:#f5d228">45°</span> → <span style="color:#28b45a">90°</span></div>
  <div><span class="sw" style="background:#e88a2e"></span>horizontal (bridge)</div>
  <div><span class="sw" style="background:#9aa3b2"></span>joint</div>
  <div style="margin-top:4px"><span style="color:#ffd700">⬆</span> build direction (up) &nbsp;·&nbsp; <span style="color:#ff4d4d">●</span> print start (lowest vertex)</div>
</div>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151b);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10000);
camera.position.set(60, 50, 90);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.45));
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.1));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
dirLight.position.set(1, 2, 1);
scene.add(dirLight);

let grid = null, axes = null, mesh = null, startMarker = null;

const plainMat = new THREE.MeshStandardMaterial({ color: 0x9fb4d0, metalness: 0.15, roughness: 0.45, flatShading: true, side: THREE.DoubleSide });
const colorMat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.9, metalness: 0.0, flatShading: true });

const stlLoader = new STLLoader();
const plyLoader = new PLYLoader();
const statsEl = document.getElementById('stats');
const pathEl = document.getElementById('path');
const colorEl = document.getElementById('color');

// Build-direction arrow (up = +Z).
const upArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), 40, 0xffd700, 6, 4);
scene.add(upArrow);

function makeLabel(text, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.font = 'Bold 44px sans-serif'; ctx.fillStyle = color; ctx.textAlign = 'center';
  ctx.fillText(text, 128, 48);
  const tex = new THREE.CanvasTexture(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  s.scale.set(10, 2.5, 1);
  return s;
}
const upLabel = makeLabel('UP', '#ffd700');
scene.add(upLabel);

function overhangColor(nz) {
  const c = new THREE.Color();
  if (nz >= 0.7071) c.setHSL(0.38, 0.75, 0.5);      // green
  else if (nz >= 0.0) c.setHSL(0.13, 0.8, 0.5);      // yellow
  else c.setHSL(0.0, 0.8, 0.55);                     // red
  return c;
}

function colorize(geometry) {
  const pos = geometry.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i += 3) {
    a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);
    e1.subVectors(b, a); e2.subVectors(c, a); n.crossVectors(e1, e2).normalize();
    const col = overhangColor(n.z);
    for (let k = 0; k < 3; k++) { colors[(i + k) * 3] = col.r; colors[(i + k) * 3 + 1] = col.g; colors[(i + k) * 3 + 2] = col.b; }
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}

function setGeometry(geometry, hasBakedColors) {
  geometry.computeVertexNormals();
  if (!hasBakedColors) colorize(geometry);   // STL: overhang coloring fallback

  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }

  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const size = new THREE.Vector3().subVectors(bb.max, bb.min);
  const center = new THREE.Vector3().addVectors(bb.min, bb.max).multiplyScalar(0.5);
  geometry.translate(-center.x, -center.y, -center.z);

  mesh = new THREE.Mesh(geometry, colorEl.checked ? colorMat : plainMat);
  scene.add(mesh);

  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const dist = maxDim * 1.9;
  camera.position.set(dist * 0.8, dist * 0.6, dist);
  camera.near = maxDim / 200; camera.far = maxDim * 200; camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0); controls.update();

  if (grid) scene.remove(grid);
  grid = new THREE.GridHelper(Math.max(maxDim * 1.6, 10), 20, 0x3a3f4a, 0x23272f);
  grid.position.y = -size.y / 2;
  scene.add(grid);

  if (axes) scene.remove(axes);
  axes = new THREE.AxesHelper(maxDim * 0.75);
  scene.add(axes);

  // Up arrow + label, placed at the low corner pointing +Z.
  upArrow.position.set(size.x / 2 + maxDim * 0.18, -size.y / 2, -size.z / 2);
  upArrow.setLength(maxDim * 0.55, maxDim * 0.12, maxDim * 0.06);
  upLabel.position.copy(upArrow.position).add(new THREE.Vector3(0, 0, maxDim * 0.62));

  // Print-start marker: lowest vertex (min z).
  const pos = geometry.attributes.position;
  let lowest = new THREE.Vector3(Infinity, Infinity, Infinity);
  for (let i = 0; i < pos.count; i++) {
    const p = new THREE.Vector3().fromBufferAttribute(pos, i);
    if (p.z < lowest.z) lowest = p;
  }
  if (startMarker) scene.remove(startMarker);
  startMarker = new THREE.Mesh(
    new THREE.SphereGeometry(Math.max(maxDim * 0.02, 1.5), 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xff4d4d })
  );
  startMarker.position.copy(lowest);
  scene.add(startMarker);

  const tri = geometry.attributes.position.count / 3;
  statsEl.className = '';
  statsEl.textContent = `tris ${tri.toLocaleString()} · ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} mm · start z=${lowest.z.toFixed(1)}`;
}

function setError(msg) { statsEl.className = 'err'; statsEl.textContent = 'error: ' + msg; }
function toUrl(p) { return p.startsWith('/') ? p : '/' + p; }

async function loadBuffer(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + url);
  return res.arrayBuffer();
}

async function doLoadPath() {
  const raw = pathEl.value.trim();
  if (!raw) return;
  try {
    const url = toUrl(raw);
    const buf = await loadBuffer(url);
    if (url.toLowerCase().endsWith('.ply')) {
      setGeometry(plyLoader.parse(buf), true);   // baked rod colors
    } else {
      setGeometry(stlLoader.parse(buf), false);  // overhang coloring
    }
  } catch (e) { setError(e.message); }
}

function doLoadBuffer(buf, name) {
  try {
    if (name && name.toLowerCase().endsWith('.ply')) setGeometry(plyLoader.parse(buf), true);
    else setGeometry(stlLoader.parse(buf), false);
  } catch (e) { setError(e.message); }
}

document.getElementById('load').addEventListener('click', doLoadPath);
pathEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLoadPath(); });
colorEl.addEventListener('change', () => { if (mesh) mesh.material = colorEl.checked ? colorMat : plainMat; });

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) f.arrayBuffer().then(buf => doLoadBuffer(buf, f.name)).catch(err => setError(err.message));
});

const params = new URLSearchParams(location.search);
const initial = params.get('file');
if (initial) { pathEl.value = initial; doLoadPath(); }

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
