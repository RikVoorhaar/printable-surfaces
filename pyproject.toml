[project]
name = "printable-surfaces"
version = "0.1.0"
description = "Turn shapes into printable rod-and-node lattices — cool geometric cages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "numpy-stl>=4.1.1",
    "scipy>=1.18.1",
    "trimesh>=5.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printable_surfaces"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
